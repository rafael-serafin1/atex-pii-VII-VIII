name: CI
on:
    pull_request: 
        branches: 
            - main
jobs:
    build:
        runs-on: windows-latest

        steps:
            - name: Checkout
              uses: actions/checkout@v4
            
            - name: Setup Nodejs
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: npm

            - name: Install React and Vite dependencies
              run: npm ci
    
